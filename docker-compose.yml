version: '3.8'

# ═══════════════════════════════════════════════════════════════════════════════
#  Smart E-Fining System — Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
#
#  ESP32 Connectivity:
#    The backend binds to 0.0.0.0:5000, making it reachable from any device on
#    your local network (including the ESP32).
#
#    In the Arduino sketch, set:
#      DOCKER_MODE     = true
#      DOCKER_HOST_IP  = "<your-PC's-WiFi-IP>"   (e.g. 192.168.100.163)
#      DOCKER_PORT     = 5000
#
#    The ESP32 will POST to: http://<your-PC-IP>:5000/api/telemetry
#
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: smart_efining_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - efining_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Express Backend API
  #    Exposed on 0.0.0.0:5000 so the ESP32 can reach it over the LAN.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_efining_backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smart_e_fining
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=supersecretjwtkey_presentation_demo_2026
      - SEED_ADMIN_USERNAME=superadmin
      - SEED_ADMIN_PASSWORD=ChangeMe123!
    networks:
      - efining_net
    depends_on:
      mongodb:
        condition: service_healthy

  # 3. React Frontend (Served via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_efining_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    networks:
      - efining_net
    depends_on:
      - backend

networks:
  efining_net:
    driver: bridge

volumes:
  mongo_data:
